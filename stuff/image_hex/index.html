<!DOCTYPE html>
<html>

<head>
    <title>Text & Binary Hex Cipher</title>
    <style>
        body {
            font-family: Arial;
            background: #111;
            color: white;
            padding: 20px;
        }

        textarea {
            width: 100%;
            height: 150px;
            background: #222;
            color: white;
            border: 1px solid #444;
            padding: 10px;
        }

        canvas {
            margin-top: 20px;
            border: 1px solid #444;
            max-width: 100%;
        }

        input,
        button,
        select {
            margin-top: 10px;
            padding: 8px;
            background: #222;
            color: white;
            border: 1px solid #444;
        }

        hr {
            margin: 20px 0;
            border-color: #333;
        }

        pre {
            white-space: pre-wrap;
            background: #222;
            padding: 10px;
            border: 1px solid #444;
        }

        .info-panel {
            background: #1a1a1a;
            border: 1px dashed #444;
            padding: 10px;
            margin-top: 10px;
            font-family: monospace;
            color: #0ff;
        }

        .dropdown-box {
            margin-top: 10px;
            padding: 15px;
            background: #222;
            align-items: center;
            justify-content: center;
            flex-direction: column;
            border: 1px solid #444;
            color: white;
            width: 250px;
        }
    </style>
</head>

<body>

    <h2>Text & Binary Hex Cipher</h2>

    <!-- FORMAT SELECTOR -->
    <label for="mediaType">Encoding Type: </label>
    <select id="mediaType" onchange="toggleMediaType()">
        <option value="text">Text (0x00)</option>
        <option value="binary">Raw Binary File (0xFF)</option>
    </select>

    <br><br>

    <!-- TEXT INPUT -->
    <div id="textSection">
        <textarea id="textInput" placeholder="Enter text..." oninput="updateEstimates()"></textarea><br>
    </div>

    <!-- BINARY FILE INPUT -->
    <div id="binarySection" style="display:none;">
        <input type="file" id="binaryFileInput" onchange="updateBinaryFileInput()"><br>
    </div>

    <button onclick="generateSourceMedia(); showDropdown('encode_output')">Generate Media File</button>
    <button onclick="toggleDropdown('encode_output')">Toggle Output</button>

    <!-- STATS / METADATA COUNTERS -->
    <div class="info-panel" id="statsPanel">
        Dimensions: 0 x 0 px<br>
        Estimated File Size: 0 KB
    </div>

    <div id="encode_output" class="dropdown-box" style="display: none;"> </div>

    <hr>

    <!-- NOISE GENERATOR -->
    <input id="noiseSize" type="number" placeholder="Noise size (e.g. 128)">
    <button onclick="generateNoise(); showDropdown('noise_output')">Generate Color Noise</button>
    <button onclick="toggleDropdown('noise_output')">Toggle Output</button>

    <div id="noise_output" class="dropdown-box" style="display: none;"> </div>

    <hr>

    <p>Noise Map:</p>
    <input type="file" id="noiseFile" accept="image/*">

    <p>Target Image:</p>
    <input type="file" id="imageFile" accept="image/*">

    <br>

    <button onclick="encrypt(); showDropdown('noise_offset_output')">Encrypt (Add)</button>
    <button onclick="decrypt(); showDropdown('noise_offset_output')">Decrypt (Subtract)</button>

    <button onclick="downloadImage()">Download Output</button>
    <button onclick="toggleDropdown('noise_offset_output')">Toggle Output</button>

    <!-- OUTPUT AREA -->
    <div id="noise_offset_output" class="dropdown-box" style="display: none;"> </div>

    <!-- DECODER -->
    <h3>Decode Image → Data</h3>

    <input type="file" id="decodeFile" accept="image/*">
    <button onclick="generateDecodedText()">Decode Image</button>

    <div class="info-panel" id="decodeStatsPanel">
        Estimated File Size: 0 KB
    </div>

    <pre id="decodeOutput"></pre>

    <script src="script.js"></script>
    <script>
        function showDropdown(id) {
            const box = document.getElementById(id);
            box.style.display = "flex";
        }
        function hideDropdown(id) {
            const box = document.getElementById(id);
            box.style.display = "none";
        }

        function toggleDropdown(id) {
            const box = document.getElementById(id);
            if (box.style.display === "none") {
                box.style.display = "flex";
            } else {
                box.style.display = "none";
            }
        }
    </script>
</body>

</html>
